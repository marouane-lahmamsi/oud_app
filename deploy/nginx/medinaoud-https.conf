server {
    listen 80;
    listen [::]:80;
    server_name medinaoud.com www.medinaoud.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/oud_app/frontend;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://medinaoud.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.medinaoud.com;

    ssl_certificate /etc/letsencrypt/live/medinaoud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medinaoud.com/privkey.pem;

    return 301 https://medinaoud.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name medinaoud.com;

    ssl_certificate /etc/letsencrypt/live/medinaoud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medinaoud.com/privkey.pem;

    location = / {
        return 301 /oud/;
    }

    location = /oud {
        return 301 /oud/;
    }

    # The current application remains served by the default VPS virtual host.
    location /oud/ {
        proxy_pass http://127.0.0.1;
        proxy_set_header Host 88.223.92.174;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
