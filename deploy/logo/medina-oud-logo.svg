<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Icon: Stylized Oud wood piece with flame/smoke -->
  <g transform="translate(20, 20)">
    <!-- Wood piece base -->
    <path d="M10 60 Q10 40 25 35 L55 30 Q70 28 75 40 Q80 55 70 65 L45 75 Q25 82 10 60Z" fill="#8B6914"/>
    <!-- Wood grain detail -->
    <path d="M20 50 Q35 45 50 48 Q60 50 65 45" stroke="#5C4510" stroke-width="2" fill="none"/>
    <path d="M25 58 Q40 55 55 58" stroke="#5C4510" stroke-width="1.5" fill="none"/>
    <!-- Flame/smoke -->
    <path d="M55 30 Q60 15 55 5 Q50 15 52 25" stroke="#C9A962" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M62 28 Q68 18 65 10" stroke="#D4AF37" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Wordmark: Medina Oud -->
  <text x="110" y="55" font-family="Cormorant Garamond, Georgia, serif" font-size="42" font-weight="600" fill="#2D2A26">
    Medina
  </text>
  <text x="225" y="55" font-family="Cormorant Garamond, Georgia, serif" font-size="42" font-weight="400" fill="#C9A962">
    Oud
  </text>
  
  <!-- Tagline -->
  <text x="110" y="78" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#8B8680" letter-spacing="2">
    L'ART DE L'OUD AUTHENTIQUE
  </text>
</svg>
