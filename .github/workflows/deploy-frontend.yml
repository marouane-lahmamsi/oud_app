name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: |
          echo "📦 Installing frontend dependencies..."
          npm ci
          echo "✅ Dependencies installed"

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          echo "🔨 Building frontend for production..."
          npm run build
          echo "✅ Build completed"

      - name: Verify Build Output
        working-directory: ./frontend
        run: |
          echo "📂 Verifying build output..."
          ls -la dist/
          if [ ! -f "dist/index.html" ]; then
            echo "❌ index.html not found in build output"
            exit 1
          fi
          if [ ! -d "dist/assets" ]; then
            echo "❌ assets directory not found in build output"
            exit 1
          fi
          echo "✅ Build output verified"

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Add Host to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts

      - name: Deploy Frontend to VPS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          echo "🚀 Deploying frontend to VPS..."

          # Create frontend directory on VPS
          ssh -p $VPS_PORT $VPS_USER@$VPS_IP "mkdir -p /var/www/oud_app/frontend"

          # Sync built frontend files
          rsync -avz --delete \
            -e "ssh -p $VPS_PORT" \
            ./frontend/dist/ $VPS_USER@$VPS_IP:/var/www/oud_app/frontend/

          echo "✅ Frontend deployed"

      - name: Fix Permissions
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          echo "🔧 Fixing permissions..."

          ssh -p $VPS_PORT $VPS_USER@$VPS_IP << 'EOF'
            # Set correct ownership for Nginx
            chown -R www-data:www-data /var/www/oud_app/frontend/
            chmod -R 755 /var/www/oud_app/frontend/

            echo "✅ Permissions fixed"
          EOF

      - name: Reload Nginx
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          echo "🔄 Reloading Nginx..."

          ssh -p $VPS_PORT $VPS_USER@$VPS_IP << 'EOF'
            # Test Nginx configuration
            nginx -t

            # Reload Nginx
            systemctl reload nginx

            echo "✅ Nginx reloaded"
          EOF

      - name: Verify Deployment
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
        run: |
          echo "🔍 Verifying frontend deployment..."

          # Wait for Nginx to reload
          sleep 2

          # Test frontend loading
          FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$VPS_IP/oud/)
          if [ "$FRONTEND_STATUS" = "200" ]; then
            echo "✅ Frontend loads correctly (HTTP 200)"
          else
            echo "❌ Frontend returned HTTP $FRONTEND_STATUS"
            exit 1
          fi

          # Test assets loading
          JS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$VPS_IP/oud/assets/)
          if [ "$JS_STATUS" = "200" ] || [ "$JS_STATUS" = "403" ]; then
            echo "✅ Assets directory accessible"
          else
            echo "❌ Assets directory returned HTTP $JS_STATUS"
          fi

          echo "✅ Frontend deployment verified"
