name: Deploy Frontend
# trigger: manual-relaunch-2026-05-24

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'deploy/nginx/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Verify Build Output
        working-directory: ./frontend
        run: |
          test -f dist/index.html
          test -d dist/assets

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Add Host to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy Frontend to VPS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" "mkdir -p /var/www/oud_app/frontend"

          rsync -avz --delete \
            -e "ssh -p $VPS_PORT" \
            ./frontend/dist/ "$VPS_USER@$VPS_IP:/var/www/oud_app/frontend/"

      - name: Fix Permissions and Reload Nginx
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" << 'EOF'
            set -e
            chown -R www-data:www-data /var/www/oud_app/frontend/
            chmod -R 755 /var/www/oud_app/frontend/
            nginx -t
            systemctl reload nginx
          EOF

      - name: Configure Medina Oud domain and HTTPS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          scp -P "$VPS_PORT" deploy/nginx/medinaoud-http.conf \
            "$VPS_USER@$VPS_IP:/tmp/medinaoud-http.conf"
          scp -P "$VPS_PORT" deploy/nginx/medinaoud-https.conf \
            "$VPS_USER@$VPS_IP:/tmp/medinaoud-https.conf"

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" << 'EOF'
            set -e

            if [ "$(id -u)" -eq 0 ]; then
              SUDO=""
            else
              SUDO="sudo"
            fi

            $SUDO install -m 644 /tmp/medinaoud-http.conf /etc/nginx/conf.d/medinaoud.com.conf
            $SUDO nginx -t
            $SUDO systemctl reload nginx

            DNS_IPS="$(getent ahostsv4 medinaoud.com 2>/dev/null | awk '{print $1}' | sort -u || true)"
            if ! printf '%s\n' "$DNS_IPS" | grep -qx '88.223.92.174'; then
              echo "medinaoud.com is not yet resolving to this VPS; HTTPS will be provisioned on the next frontend deployment."
              exit 0
            fi

            if ! command -v certbot >/dev/null 2>&1; then
              $SUDO apt-get update
              $SUDO apt-get install -y certbot
            fi

            if $SUDO certbot certonly --webroot -w /var/www/oud_app/frontend \
              --non-interactive --agree-tos --email jaknitaha@gmail.com \
              --keep-until-expiring --deploy-hook "$SUDO systemctl reload nginx" \
              -d medinaoud.com -d www.medinaoud.com; then
              $SUDO install -m 644 /tmp/medinaoud-https.conf /etc/nginx/conf.d/medinaoud.com.conf
              $SUDO nginx -t
              $SUDO systemctl reload nginx
            else
              echo "TLS certificate was not issued yet; HTTP remains available while DNS propagation completes."
            fi
          EOF

      - name: Verify Deployment
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          sleep 2

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" << 'EOF'
            set -e
            curl -fsS http://127.0.0.1/oud/ > /dev/null
            curl -fsS http://127.0.0.1/oud/assets/ > /dev/null || true
          EOF
