name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Add Host to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy Backend to VPS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" "mkdir -p /var/www/oud_app/backend"

          rsync -avz --delete \
            -e "ssh -p $VPS_PORT" \
            --exclude='venv' \
            --exclude='.venv313' \
            --exclude='uploads' \
            --exclude='uploads/**' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.idea' \
            --exclude='.git' \
            --exclude='instance/*.db' \
            ./backend/ "$VPS_USER@$VPS_IP:/var/www/oud_app/backend/"

      - name: Setup Virtual Environment and Install Dependencies
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" << 'EOF'
            set -e
            cd /var/www/oud_app/backend

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
          EOF

      - name: Write Environment File
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" "mkdir -p /var/www/oud_app/backend"
          printf '%s\n' "$BACKEND_ENV_FILE" | ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" "cat > /var/www/oud_app/backend/.env && chmod 600 /var/www/oud_app/backend/.env"

      - name: Restart Backend Service
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" << 'EOF'
            set -e
            systemctl daemon-reload
            systemctl restart oud-backend
            systemctl status oud-backend --no-pager
          EOF

      - name: Verify Deployment
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          sleep 3

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" << 'EOF'
            set -e
            curl -fsS http://127.0.0.1:5001/health
            curl -fsS http://127.0.0.1/oud/api/v1/products/ > /dev/null
          EOF
