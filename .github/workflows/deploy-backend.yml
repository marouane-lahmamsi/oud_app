name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Add Host to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts

      - name: Deploy Backend to VPS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          echo "🚀 Deploying backend to VPS..."

          # Create backend directory on VPS
          ssh -p $VPS_PORT $VPS_USER@$VPS_IP "mkdir -p /var/www/oud_app/backend"

          # Sync backend code (excluding venv and __pycache__)
          rsync -avz --delete \
            -e "ssh -p $VPS_PORT" \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.idea' \
            --exclude='.git' \
            --exclude='instance/*.db' \
            ./backend/ $VPS_USER@$VPS_IP:/var/www/oud_app/backend/

          echo "✅ Backend code synced"

      - name: Setup Virtual Environment and Install Dependencies
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        run: |
          echo "🐍 Setting up Python virtual environment..."

          ssh -p $VPS_PORT $VPS_USER@$VPS_IP << 'EOF'
            cd /var/www/oud_app/backend

            # Create virtual environment if it doesn't exist
            if [ ! -d "venv" ]; then
              echo "Creating virtual environment..."
              python3 -m venv venv
            fi

            # Activate and install dependencies
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "✅ Dependencies installed"
          EOF

      - name: Write Environment File
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        run: |
          echo "📝 Writing environment file..."

          # Write the .env file from GitHub secret
          ssh -p $VPS_PORT $VPS_USER@$VPS_IP "echo '$BACKEND_ENV_FILE' > /var/www/oud_app/backend/.env"

          echo "✅ Environment file written"

      - name: Restart Backend Service
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          echo "🔄 Restarting backend service..."

          ssh -p $VPS_PORT $VPS_USER@$VPS_IP << 'EOF'
            # Reload systemd and restart service
            systemctl daemon-reload
            systemctl restart oud-backend
            systemctl status oud-backend --no-pager

            echo "✅ Backend service restarted"
          EOF

      - name: Verify Deployment
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          echo "🔍 Verifying backend deployment..."

          # Wait for service to start
          sleep 3

          # Test health endpoint locally on VPS
          ssh -p $VPS_PORT root@$VPS_IP "curl -s http://127.0.0.1:5001/health"

          # Test API endpoint through Nginx
          curl -s -o /dev/null -w "%{http_code}" http://$VPS_IP/oud/api/v1/products/ | grep 200 && echo " ✅ API responding" || echo " ❌ API not responding"

          echo "✅ Backend deployment verified"
