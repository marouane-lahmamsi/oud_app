name: Deploy Backend
# trigger: manual-relaunch-2026-05-24

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Add Host to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy Backend to VPS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" "mkdir -p /var/www/oud_app/backend"

          rsync -avz --delete \
            -e "ssh -p $VPS_PORT" \
            --exclude='venv' \
            --exclude='.venv313' \
            --exclude='uploads' \
            --exclude='uploads/**' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.idea' \
            --exclude='.git' \
            --exclude='instance/*.db' \
            ./backend/ "$VPS_USER@$VPS_IP:/var/www/oud_app/backend/"

      - name: Setup Virtual Environment and Install Dependencies
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" << 'EOF'
            set -e
            cd /var/www/oud_app/backend

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
          EOF

      - name: Write Environment File
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" "mkdir -p /var/www/oud_app/backend"
          printf '%s\n' "$BACKEND_ENV_FILE" | ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" "cat > /var/www/oud_app/backend/.env"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" << 'EOF'
            set -e
            SERVICE_USER="$(systemctl show -p User --value oud-backend | tr -d '[:space:]')"
            SERVICE_GROUP="$(systemctl show -p Group --value oud-backend | tr -d '[:space:]')"

            if [ -z "$SERVICE_USER" ]; then
              SERVICE_USER="root"
            fi

            if [ -z "$SERVICE_GROUP" ]; then
              SERVICE_GROUP="$(id -gn "$SERVICE_USER")"
            fi

            chown "$SERVICE_USER:$SERVICE_GROUP" /var/www/oud_app/backend/.env
            chmod 640 /var/www/oud_app/backend/.env
          EOF

      - name: Restart Backend Service
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" << 'EOF'
            set -e
            systemctl daemon-reload
            systemctl restart oud-backend
            systemctl status oud-backend --no-pager
          EOF

      - name: Verify Deployment
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_IP" << 'EOF'
            set -e
            HEALTH_OK=0
            for attempt in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:5001/health > /dev/null; then
                HEALTH_OK=1
                break
              fi
              sleep 2
            done

            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "Backend health check failed after retries."
              systemctl status oud-backend --no-pager || true
              journalctl -u oud-backend -n 80 --no-pager || true
              exit 1
            fi

            curl -fsS http://127.0.0.1/oud/api/v1/products/ > /dev/null
          EOF
